[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piagent"
version = "0.1.0"
description = "Privacy-first, offline-capable voice agent for Raspberry Pi and Android"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "cryptography>=44,<49",
    "fastapi>=0.115,<1.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "dashboard*"]

[tool.setuptools.package-data]
dashboard = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
